name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Finish each live release before starting another one.
concurrency:
  group: firebase-live-listening-7680f
  cancel-in-progress: false

jobs:
  deploy_live:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install import function dependencies
        run: npm ci --prefix functions

      - name: Test deployment verification
        run: node --test .github/scripts/verify-deployment.test.mjs

      - name: Authenticate for Firebase deployment
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LISTENING_7680F }}

      - name: Deploy import function and Hosting live release
        run: npx --yes firebase-tools@15.27.0 deploy --only functions:past-exam,hosting:listeningpractice --project listening-7680f --non-interactive

      - name: Verify live teacher page and import API
        run: node .github/scripts/verify-deployment.mjs
