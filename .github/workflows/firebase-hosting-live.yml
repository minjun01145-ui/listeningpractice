name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Finish each live release before starting another one.
concurrency:
  group: firebase-live-listening-7680f
  cancel-in-progress: false

jobs:
  deploy_live:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select deployment targets
        id: targets
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          targets='functions:past-exam,hosting:listeningpractice'
          # UI-only releases do not need to redeploy the unchanged server function.
          if [[ "$EVENT_NAME" == 'push' && "$BEFORE_SHA" =~ ^[0-9a-f]{40}$ && "$BEFORE_SHA" != '0000000000000000000000000000000000000000' ]]; then
            if git diff --quiet "$BEFORE_SHA" "$GITHUB_SHA" -- functions firebase.json .firebaserc; then
              targets='hosting:listeningpractice'
            fi
          fi
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install import function dependencies
        run: npm ci --prefix functions

      - name: Test deployment verification
        run: node --test .github/scripts/*.test.mjs

      - name: Authenticate for Firebase deployment
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LISTENING_7680F }}

      - name: Deploy Firebase live release
        env:
          DEPLOY_TARGETS: ${{ steps.targets.outputs.targets }}
        run: node .github/scripts/deploy-live.mjs

      - name: Verify live teacher page and import API
        run: node .github/scripts/verify-deployment.mjs
